spring.application.name=weather-agent

# I produksjon injiserer hosten (Render/Railway/Fly) en PORT vi MAA lytte pa.
# Lokalt faller vi tilbake til 8080. server.address=0.0.0.0 sa containeren
# tar imot trafikk utenfra, ikke bare fra localhost inne i containeren.
server.port=${PORT:8080}
server.address=0.0.0.0

# MET krever en identifiserende User-Agent med kontaktinfo.
# Bytt gjerne ut e-posten med din egen / en GitHub-URL nar du publiserer prosjektet.
met.user-agent=weather-agent/0.1 (oskarkotyla123@gmail.com)

# Lokal LLM for aa tolke fritekst-sporsmal (HANDOFF §6). Bare base-URL byttes
# for aa ga mot Ollama (http://localhost:11434/v1) eller sky senere.
# llm.model: i LM Studio kan du som regel bruke et hvilket som helst navn, eller
# id-en til modellen du har lastet. Sjekk "Loaded models" i LM Studio sin server-fane.
llm.base-url=http://localhost:1234/v1
llm.model=local-model

# Modell-ruting etter oppgavens kompleksitet (kostnadsstyring):
#   llm.model.fast  - billig modell for stram ekstraksjon (vaersok-tolkning)
#   llm.model.smart - bedre modell for resonnering (AI-treningsforslag)
# Begge faller tilbake til llm.model, saa ett-modells-oppsett (lokal LM Studio)
# fungerer uendret. Sky-eksempel: LLM_MODEL_FAST=gpt-4o-mini, LLM_MODEL_SMART=gpt-4o.
# Hvis fast-modellen svarer uparserbart, proves SMART een gang (kun naar de er ulike).
llm.model.fast=${llm.model}
llm.model.smart=${llm.model}

# API-nokkel for sky-LLM. La staa TOM for lokal LM Studio/Ollama.
# IKKE skriv en ekte nokkel her (havner i git). Sett den heller via miljovariabel
# (LLM_API_KEY) eller i application-local.properties. Tilsvarende for sky:
#   LLM_BASE_URL, LLM_MODEL, LLM_MODEL_FAST, LLM_MODEL_SMART, LLM_API_KEY
llm.api-key=

# OpenRouteService for ruting langs faktiske stier (foot-hiking). Gratis nokkel fra
# openrouteservice.org. Tom = ruting AV (ruteplanleggeren bruker da rett linje +
# Open-Meteo-hoyde). IKKE skriv nokkelen her - sett den via miljovariabel ORS_API_KEY.
ors.base-url=https://api.openrouteservice.org
ors.api-key=

# --- Database (Supabase Postgres) ---
# Settes via miljovariabler (aldri i git). Bruk Supabase sin pooler-streng (IPv4).
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/postgres
#   SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Flyway eier skjemaet; JPA bare validerer at det stemmer.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Batch-innsetting: uten dette blir hver rad en egen INSERT (round-trip til DB).
# Viktig for Garmin-import (hundrevis av okter) - gaar fra ~1 min til sekunder.
# reWriteBatchedInserts=true faar PG-driveren til aa slaa dem sammen til ett kall.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# --- Auth (Supabase JWT) ---
# Eldre prosjekter signerer tokens med HS256 (delt secret): sett SUPABASE_JWT_SECRET
# (Supabase Settings -> API -> JWT Secret). Nyere/asymmetriske prosjekter: sett heller
# SUPABASE_JWKS_URI (= https://<ref>.supabase.co/auth/v1/.well-known/jwks.json).
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:}

# --- CORS ---
# Hvilke opphav får kalle API-et. Mobil-appene (Capacitor bruker capacitor://localhost
# på iOS og http://localhost på Android) + dev-frontend. Overstyr med APP_CORS_ALLOWED_ORIGINS
# (komma-separert) i produksjon, f.eks. https://din-app-url.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:capacitor://localhost,http://localhost,https://localhost,ionic://localhost,http://localhost:5173}
