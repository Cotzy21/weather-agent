spring.application.name=weather-agent

# MET krever en identifiserende User-Agent med kontaktinfo.
# Bytt gjerne ut e-posten med din egen / en GitHub-URL nar du publiserer prosjektet.
met.user-agent=weather-agent/0.1 (oskarkotyla123@gmail.com)

# Lokal LLM for aa tolke fritekst-sporsmal (HANDOFF §6). Bare base-URL byttes
# for aa ga mot Ollama (http://localhost:11434/v1) eller sky senere.
# llm.model: i LM Studio kan du som regel bruke et hvilket som helst navn, eller
# id-en til modellen du har lastet. Sjekk "Loaded models" i LM Studio sin server-fane.
llm.base-url=http://localhost:1234/v1
llm.model=local-model

# API-nokkel for sky-LLM. La staa TOM for lokal LM Studio/Ollama.
# IKKE skriv en ekte nokkel her (havner i git). Sett den heller via miljovariabel
# (LLM_API_KEY) eller i application-local.properties. Tilsvarende for sky:
#   LLM_BASE_URL, LLM_MODEL, LLM_API_KEY
llm.api-key=

# OpenRouteService for ruting langs faktiske stier (foot-hiking). Gratis nokkel fra
# openrouteservice.org. Tom = ruting AV (ruteplanleggeren bruker da rett linje +
# Open-Meteo-hoyde). IKKE skriv nokkelen her - sett den via miljovariabel ORS_API_KEY.
ors.base-url=https://api.openrouteservice.org
ors.api-key=
