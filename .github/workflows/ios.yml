name: iOS

# Bygger iPhone-appen (Capacitor) på en macOS-maskin, så vi slipper en egen Mac for å se at prosjektet kompilerer.
#  - build:      alltid (uten signering, mot simulator). Kjører når iOS-prosjektet eller Capacitor-oppsettet endres.
#  - testflight: kun manuelt (Actions → iOS → Run workflow, «upload»), og krever Apple-hemmelighetene under.
#    workflow_dispatch finnes først når denne filen ligger i standard-branchen (main).
#
# Repo-variabler (Settings → Secrets and variables → Actions → Variables), samme som frontend/.env:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (begge er offentlige)
# Hemmeligheter til testflight-jobben (Apple Developer + App Store Connect):
#   APPLE_TEAM_ID      Team-ID (10 tegn) fra developer.apple.com → Membership
#   ASC_KEY_ID         App Store Connect → Users and Access → Integrations → nøkkelens ID
#   ASC_ISSUER_ID      samme side, «Issuer ID»
#   ASC_KEY_P8         hele innholdet i AuthKey_XXXX.p8 (rolle: App Manager eller Admin)

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/ios/**'
      - 'frontend/capacitor.config.json'
      - 'frontend/.env.native'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Bygg signert og last opp til TestFlight'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: xcodebuild -version
      - name: Bygg web-appen (native modus) og kopier inn i iOS-prosjektet
        run: npm run ios:sync
      - name: Kompiler for simulator (uten signering)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: build
    runs-on: macos-26
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ios:sync
      - name: App Store Connect-nøkkel
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Arkiver (signeres automatisk med nøkkelen)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Eksporter og last opp til TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Fjern nøkkelen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
